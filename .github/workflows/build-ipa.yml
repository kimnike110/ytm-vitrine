name: Build IPA from your own YouTube Music IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted YouTube Music IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download YouTube Music IPA
        run: |
          mkdir -p ipa
          URL="${{ inputs.ipa_url }}"
          curl -fsSLg "$URL" -o ipa/youtubemusic.ipa
          
          # If the user pasted a filebin bin page instead of the direct file link, automatically extract the IPA link
          if grep -q "<!doctype html>" ipa/youtubemusic.ipa 2>/dev/null || grep -q "<html" ipa/youtubemusic.ipa 2>/dev/null; then
            echo "Detected filebin webpage URL. Auto-extracting direct IPA file download link..."
            IPA_HREF="$(grep -oE '/[a-zA-Z0-9]+/[^"'\''<> ]+\.ipa' ipa/youtubemusic.ipa | head -1)"
            if [ -n "$IPA_HREF" ]; then
              echo "Downloading direct file: https://filebin.net$IPA_HREF"
              curl -fsSLg "https://filebin.net$IPA_HREF" -o ipa/youtubemusic.ipa
            fi
          fi
          
          case "$(file --mime-type -b ipa/youtubemusic.ipa)" in
            application/zip|application/x-ios-app) echo "IPA verified successfully." ;;
            *) echo "::error::Provided URL did not download a valid IPA archive."; exit 1 ;;
          esac

      - name: Build and Inject Tweak
        run: |
          chmod +x scripts/*.sh
          make release IPA=ipa/youtubemusic.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: inputs.upload_method != 'filebin'
        with:
          name: ytm-vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="ytm-vitrine-${{ github.run_id }}"
          echo "### filebin.net download link" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _Note: filebin bins expire after a few days of inactivity._" >> "$GITHUB_STEP_SUMMARY"
